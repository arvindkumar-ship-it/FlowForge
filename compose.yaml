services:
  flowforge:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      VAULT_KEY: ${VAULT_KEY:?Run npm run setup and preserve the generated key}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - flowforge-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 75s
volumes:
  flowforge-data:
